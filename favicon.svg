<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5080"/>
      <stop offset="50%" style="stop-color:#296aa5"/>
      <stop offset="100%" style="stop-color:#1e5080"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo azul -->
  <rect width="200" height="200" rx="0" fill="url(#bg)"/>
  
  <!-- Hexágono externo - branco sutil -->
  <polygon points="100,18 168,57 168,135 100,174 32,135 32,57" 
           fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Hexágono interno - branco mais sutil -->
  <polygon points="100,32 155,63 155,126 100,157 45,126 45,63" 
           fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  
  <!-- GCMA branco grande -->
  <text x="100" y="108" font-family="Arial Black,sans-serif" font-size="50" font-weight="900" 
        text-anchor="middle" fill="#ffffff" letter-spacing="4">GCMA</text>
  
  <!-- Linha com diamante - branco -->
  <line x1="32" y1="122" x2="86" y2="122" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <polygon points="100,117 107,122 100,127 93,122" fill="#ffffff" opacity="0.6"/>
  <line x1="114" y1="122" x2="168" y2="122" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  
  <!-- GRUPO FIBRAVIT branco -->
  <text x="100" y="148" font-family="Arial,sans-serif" font-size="11" font-weight="500" 
        text-anchor="middle" fill="#ffffff" letter-spacing="4" opacity="0.75">GRUPO</text>
  <text x="100" y="165" font-family="Arial Black,sans-serif" font-size="15" font-weight="900" 
        text-anchor="middle" fill="#ffffff" letter-spacing="3" opacity="0.9">FIBRAVIT</text>
</svg>