<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Teste Login</title></head>
<body style="font-family:sans-serif;padding:40px;max-width:500px;margin:0 auto">
<h2>🔐 Teste de Login</h2>
<div id="status" style="padding:10px;background:#f0f0f0;border-radius:8px;margin-bottom:20px">Aguardando...</div>
<input type="text" id="u" placeholder="usuário" value="admin" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:14px"><br>
<input type="password" id="p" placeholder="senha" value="admin123" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:14px"><br>
<button onclick="testar()" style="width:100%;padding:12px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer">Testar Login</button>
<pre id="resultado" style="margin-top:20px;background:#f8f8f8;padding:10px;border-radius:6px;font-size:12px;overflow:auto"></pre>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw-7h7GVl66pvlwxkz8uqQggPxwDsrrvB9RGiAkNn8dcVch8WSvAIpLYOFI8OPcB7OW5A/exec';

async function testar(){
  const login = document.getElementById('u').value.trim();
  const senha = document.getElementById('p').value.trim();
  const status = document.getElementById('status');
  const resultado = document.getElementById('resultado');
  
  status.textContent = '⏳ Testando...';
  status.style.background = '#fef3c7';
  resultado.textContent = '';
  
  try {
    const url = `${API}?action=login&login=${encodeURIComponent(login)}&senha=${encodeURIComponent(senha)}`;
    resultado.textContent = 'URL: ' + url + '\n\nAguardando resposta...';
    
    const res = await fetch(url);
    const text = await res.text();
    resultado.textContent = 'Status HTTP: ' + res.status + '\n\nResposta:\n' + text;
    
    const data = JSON.parse(text);
    if(data.ok){
      status.textContent = '✅ LOGIN OK! Usuário: ' + data.user.nome;
      status.style.background = '#d1fae5';
    } else {
      status.textContent = '❌ Falhou: ' + (data.error || 'erro desconhecido');
      status.style.background = '#fee2e2';
    }
  } catch(e) {
    status.textContent = '❌ ERRO: ' + e.message;
    status.style.background = '#fee2e2';
    resultado.textContent += '\n\nERRO: ' + e.toString();
  }
}

// Testar automaticamente ao carregar
window.onload = testar;
</script>
</body>
</html>
